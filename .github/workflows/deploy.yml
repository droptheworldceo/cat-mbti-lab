name: Deploy Cat MBTI Lab to Supabase & Vercel

# 2026-10-22: push 자동 실행 끔. 필요한 비밀값(SUPABASE_PROJECT_ID·SUPABASE_ACCESS_TOKEN)이 없어 매번 실패했고,
# 분석 함수는 꺼 둔 상태. 쓸 때는 비밀값을 등록하고 Actions에서 수동 실행(Run workflow).
on:
  workflow_dispatch:

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push DB Migrations
        run: supabase db push

      - name: Deploy Edge Function (analyze-cat)
        run: supabase functions deploy analyze-cat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
